# Per-hull layout and devices for floatsam_usv_0 (SBG + shared TF).
# Robot namespace: ROBOT_NAME in usv-host-setup/config/usv-robot.env.sh
#
# Referenced from config/gnss_stack.yaml → vehicle_config.
# sbg.launch.py merges extrinsics + sbg serial into the driver param overlay.
#
# TODO(septentrio): Septentrio launches still use config/usv.yaml directly — unify later.
#
# Offsets apply to the catamaran hull w/ SBG mounted on plate
vehicle:
  name: floatsam_usv_0

sbg:
  serial_device: "/dev/usv-sbg"
  serial_baudrate: 921600   # Ellipse-D PORT_A (verified on floatsam0; was 115200 in old docs)

extrinsics:
  # ROS FLU offsets in the imu child frame (X fwd, Y port/left, Z up).
  # sbg.launch.py converts to SBG IMU FRD lever arms (Y right, Z down).
  base_frame: base_link
  imu:
    child_frame: imu
    xyz: [0.0, 0.0, 0.0]
    rpy: [0.0, 0.0, 0.0]
  gnss:
    child_frame: gnss
    # xyz: [0.0, 1.0, 0.0]   # primary antenna, 1 m port of IMU
    xyz: [-0.38, 0.305, 0.1]   # primary antenna (measured)
    rpy: [0.0, 0.0, 0.0]
  aux1:
    child_frame: aux1
    xyz: [-0.38, -0.095, 0.1]  # secondary antenna (measured)
    rpy: [0.0, 0.0, 0.0]
  vsm:
    child_frame: vsm
    xyz: [0.0, 0.0, 0.0]
    rpy: [0.0, 0.0, 0.0]

  # Below: used only by the robot description (usv_bringup description.launch.py -> robot_state_publisher).
  # parent: base_link unless stated. NOT MEASURED yet — placeholders, replace with tape-measured values.
  thruster_port:
    parent: base_link
    child_frame: thruster_port
    xyz: [-0.09, 0.25, -0.15]   # placeholder (smarc2 floatsam_description, commented out); track 0.50 m = PX4 RD_WHEEL_TRACK
    rpy: [0.0, 0.0, 0.0]
  thruster_strb:
    parent: base_link
    child_frame: thruster_strb
    xyz: [-0.09, -0.25, -0.15]  # placeholder (as above)
    rpy: [0.0, 0.0, 0.0]
  modem:
    parent: base_link
    child_frame: modem_link     # name used by smarc2 consumers
    xyz: [0.27, 0.0, -0.20]     # placeholder (constant in smarc_topics_publisher.py)
    rpy: [0.0, 0.0, 0.0]
  sonar:
    parent: base_link
    child_frame: sonar_link     # name used by smarc2 consumers
    xyz: [0.32, 0.0, -0.20]     # placeholder (constant in smarc_topics_publisher.py)
    rpy: [0.0, 0.0, 0.0]

# Hull mesh (usv_bringup/mesh/floatsam_usv.dae) relative to base_link (= SBG IMU) — visual only, approximate
# (smarc2 used -0.3 0 -0.1 relative to its own base_link). Check in RViz.
hull_visual:
  xyz: [-0.3, 0.0, -0.1]
  rpy: [0.0, 0.0, 0.0]
